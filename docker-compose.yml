# Runs the leaderboard app as a single container. Used either from the CLI
# (`docker compose up -d --build`) or imported as a stack in Portainer.
services:
  app:
    # Build context/image name. `build: .` builds from the Dockerfile in this dir.
    build: .
    image: linkedin-games-leaderboard

    # Restart the container if it (or the Docker daemon) stops.
    restart: unless-stopped

    # Map host port -> container port. Default binds to 127.0.0.1 so the app is
    # off the LAN (a Cloudflare tunnel on the host reaches it at localhost).
    # Override with LEADERBOARD_PORT_BIND, e.g. "3000:3000" to expose it on the
    # network, or "127.0.0.1:3001:3000" to move the host port. Set it in a local
    # `.env` or in Portainer's "Environment variables" section.
    ports:
      - "${LEADERBOARD_PORT_BIND:-127.0.0.1:3000:3000}"

    # Runtime config for the container, sourced via `${VAR}` substitution so the
    # same file works both locally (Docker Compose auto-loads the git-ignored
    # `.env` for interpolation) and in Portainer (which feeds its "Environment
    # variables" section here). Secrets are never baked into the image. For local
    # `docker compose up`, put the non-default values in an ignored `.env`.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: ${DB_SSL:-false}
      LEADERBOARD_INGEST_TOKEN: ${LEADERBOARD_INGEST_TOKEN}
      LEADERBOARD_ADMIN_PASSWORD: ${LEADERBOARD_ADMIN_PASSWORD}
